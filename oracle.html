<!-- nav + footer are injected by /app.js so they live in ONE place -->
<section id="oracle">
  <div class="container-narrow">
    <span class="section-label">Mystical Guidance</span>
    <h2 class="section-title">The Oracle <span>of the Cask</span></h2>
    <div class="section-divider"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="18" height="18">
    <path d="M12 2 L13.5 9 L20 8 L15 13 L18 20 L12 16 L6 20 L9 13 L4 8 L10.5 9 Z" stroke="#d4a530" stroke-width="0.8" fill="rgba(212,165,48,0.15)"/>
  </svg></div>
    <p style="font-family: 'IM Fell English', serif; font-style: italic; font-size: 1.15rem; color: #2a0e00; margin-bottom: 0.5rem; line-height: 1.8;">Cannot decide what to pour this evening? The Oracle of the Cask sees all, knows all, and has never once steered a member wrong. Pull the lever and let fate decide.</p>

    <div class="slot-machine" id="slot-machine">
      <!-- Crown -->
      <div class="slot-crown">Fortune Favours the Bold</div>

      <!-- Body -->
      <div class="slot-body">
        <!-- Reels area -->
        <div class="slot-reels-area">
          <!-- Reel labels -->
          <div class="slot-reel-labels">
            <div class="slot-reel-label">Origin</div>
            <div class="slot-reel-label-spacer"></div>
            <div class="slot-reel-label">Style</div>
            <div class="slot-reel-label-spacer"></div>
            <div class="slot-reel-label">Character</div>
          </div>

          <!-- Reels frame -->
          <div class="slot-reels-frame">
            <div class="slot-reels">
              <div class="slot-reel" id="reel-1">
                <div class="reel-strip" id="reel-strip-1"></div>
              </div>
              <div class="slot-reel-divider"></div>
              <div class="slot-reel" id="reel-2">
                <div class="reel-strip" id="reel-strip-2"></div>
              </div>
              <div class="slot-reel-divider"></div>
              <div class="slot-reel" id="reel-3">
                <div class="reel-strip" id="reel-strip-3"></div>
              </div>
            </div>
            <div class="slot-payline"></div>
          </div>

          <!-- Spin button (mobile) -->
          <button class="slot-spin-btn" id="slot-spin-btn" onclick="pullLever()">Pull the Lever</button>
        </div>

        <!-- Lever (desktop) -->
        <div class="slot-lever" id="slot-lever" onclick="pullLever()">
          <div class="lever-shaft">
            <div class="lever-knob"></div>
          </div>
          <div class="lever-base"></div>
        </div>
      </div>

      <!-- Result -->
      <div class="slot-result" id="slot-result">
        <p class="slot-result-prompt">The Oracle awaits your query...</p>
      </div>
    </div>

    <div class="oracle-bottom-ornament"><span>&#10022;</span></div>
  </div>
</section>
